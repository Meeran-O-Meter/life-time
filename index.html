<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <title>LifeTime</title>
</head>
<body>
    <div class="logo-div">
        <img class="logo-icon" src="./assets/logo.svg"></img>
        <h1 class="title">LIFE-TIME</h1>
        <img class="logo-icon" src="./assets/logo.svg"></img> 
    </div>
    
    <div class="form-container">
        <form id="form">

            <p class="instructions">Enter your birth date and time</p>

            <div class="input-bars">
                <input placeholder="..." class="input" type="text" id="birthdateInput">
                <input placeholder="00:00" class="input" type="text" id="birthtimeInput">
            </div>

            <div class="button-container">
                <button class="toggle-button" type="button" id="toggleButton">AM</button>
                <button class="submit-button" type="submit">Submit</button>
            </div>

        </form>

        <div id="timeContainer" class="time-container">
            <span class="time" id="hours">00</span>hours
            <span class="time" id="minutes">00</span>minutes
            <span class="time" id="seconds">00</span>seconds
        </div>
    </div>
    
    <div id="warningContainer" class="warning-container">
        <p id="warning" class="warning"> Write all dates in a Day-Month-Year format</p>
        <p id="example" class="example">Eg: 25 March 2011</p>

    </div>
    <p id="footer" class="footer"></p>
    
</body>
</html>
