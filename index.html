<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <title>LifeTime</title>
</head>
<body>
    <div class="logo-div">
        <img class="logo-icon" src="./assets/logo.svg"></img>
        <h1 class="title">LIFE-TIME</h1>
        <img class="logo-icon" src="./assets/logo.svg"></img> 
    </div>
    
    <div class="form-container">
        <form id="form">

            <p class="instructions">Enter your birth date and time</p>

            <div class="input-bars">
                <input placeholder="..." class="input" type="text" id="birthdateInput">
                <input placeholder="00:00" class="input" type="text" id="birthtimeInput">
            </div>

            <div class="button-container">
                <button class="toggle-button" type="button" id="toggleButton">AM</button>
                <button class="submit-button" type="submit">Submit</button>
            </div>

        </form>

        <div class="time-container">
            <span id="hours">00</span>:
            <span id="minutes">00</span>:
            <span id="seconds">00</span>
        </div>
    </div>

    
</body>
</html>
